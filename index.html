<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Ziro Site Web</title>
</head>
<body>
    <header class="header">
            
        <a href="#hero" class="logo">
            <img src="assets/imgs/logo.png" alt="logo de ziro">
            <span>Ziro: Mi primera comunión</span>
        </a>

        <!--Hamburguer Buttom-->
        <button class="buttonh" id="buttomh" type="button" 
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="navmenu"><span class="icon-hamburguer" aria-hidden="true">&#9776;
                </span>
        </button>
        
        <nav class="navbar" id="navmenu">
                <ul class="navlist">
                    <li>
                        <a href="">Inicio</a>
                    </li>
                    <li>
                        <a href="">Sobre ziro</a>
                    </li>
                    <li>
                        <a href="">Nuestra app</a>
                    </li>
                    <li>
                        <a href="">Contacto</a>
                    </li>
                    <li>
                        <a href="">Juego Demo</a>
                    </li>
                </ul>
        </nav>
    </header>
    <main>

        <section id="hero" class="hero">

            <video autoplay loop playinsline class="video-hero" aria-hidden="true">
                <source src="assets/videos/bosque-sagrado.mp4" type="video/mp4">
            </video>

            <div class="container-left">
            <h1>Un nuevo mundo donde la fe se vive jugando</h1>
            <h2>Acompaña a tu hijo a descubrir la Primera Comunión a través de misiones e historias inolvidables</h2>
            </div>

            <div class="buttoms-hero">
            <a href="">Descubrir a Ziro</a>
            <a href="">Ecosistema digital</a>
            </div>

        </section>


    </main>

</html>
